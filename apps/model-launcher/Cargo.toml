[package]
name = "model-launcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["model-launcher-ui/custom-protocol"]

[dependencies]
model-launcher-core = { path = "../../crates/model-launcher-core" }
model-launcher-api = { path = "../../crates/model-launcher-api" }
model-launcher-wsl = { path = "../../crates/model-launcher-wsl" }
model-launcher-ui = { path = "../../crates/model-launcher-tauri" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
thiserror.workspace = true
futures-util = "0.3"
async-trait.workspace = true

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tempfile = "3"
fake-llama-server = { path = "../../tests/fake-llama-server" }
