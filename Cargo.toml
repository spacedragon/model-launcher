[workspace]
resolver = "2"
members = [
    "crates/server",
    "crates/domain",
    "crates/runtime",
    "crates/runtime-llamacpp",
    "crates/runtime-ninfer",
    "crates/api-types",
    "crates/persistence",
    "crates/spike",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
# All crate versions move in lockstep for the first release.
version = "0.1.0"

[workspace.dependencies]
# Internal crates
model-serving-domain = { path = "crates/domain" }
model-serving-runtime = { path = "crates/runtime" }
model-serving-runtime-llamacpp = { path = "crates/runtime-llamacpp" }
model-serving-runtime-ninfer = { path = "crates/runtime-ninfer" }
model-serving-api-types = { path = "crates/api-types" }
model-serving-persistence = { path = "crates/persistence" }

# External (see docs/architecture.md §2)
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# RFC 3339 UTC timestamps (docs/api.md §1): `chrono::DateTime<Utc>`, serialized as
# an RFC 3339 string. Pure Rust (no system lib) on both Windows and WSL.
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SQLite (docs/architecture.md §2). `default-features = false` keeps only the
# tokio runtime + the SQLite backend; SQLite is statically bundled via
# `libsqlite3-sys` (below) so builds need no system libsqlite3 on Windows/WSL.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"