[workspace]
members = ["apps/model-launcher", "crates/model-launcher-core", "crates/model-launcher-wsl", "crates/model-launcher-api", "crates/model-launcher-ui", "tests/fake-llama-server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
async-trait = "0.1"
parking_lot = "0.12"
regex = "1"
walkdir = "2"
gguf-rs-lib = "0.3"
notify = "8.2"
slint = { version = "=1.16.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }
