[package]
name = "model-serving-spike"
description = "Disposable M0 risk spikes (S1). Safe to delete."

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = { version = "0.1", features = ["full"] }
http-body = "1"
hyper-util = "0.1"
tokio-stream = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = "1"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
# Disposable spike crate: intentionally does NOT inherit the workspace
# clippy lint set, so `cargo clippy --workspace ... -D warnings` in CI
# stays green on experimental code.