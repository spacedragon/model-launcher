[package]
name = "model-launcher-ui"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "model_launcher_ui"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
model-launcher-core = { path = "../model-launcher-core" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri = { version = "2.8", features = ["tray-icon"] }
tokio.workspace = true
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "http2"] }

[build-dependencies]
tauri-build = "2.4"
