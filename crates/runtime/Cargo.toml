[package]
name = "model-serving-runtime"
edition = "2024"
description = "RuntimeAdapter trait and process supervision shared by all inference engines"

version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
# Test-support executable used by `tests/probe.rs` to exercise the probe
# pipeline against a real, controllable child process on every platform.
name = "probe_helper"
path = "src/bin/probe_helper.rs"

[[bin]]
# Test-support executable used by `tests/supervisor.rs` to exercise the
# `ManagedProcess` supervisor against controllable child behaviour modes on
# every platform.
name = "supervisor_helper"
path = "src/bin/supervisor_helper.rs"

[target.'cfg(unix)'.dependencies]
# Direct `libc::kill(-pgid, sig)` and fixture signal setup for the process-group
# supervision contract (ADR-0002): no shelling out to coreutils `kill`, and no
# extra dependency on Windows.
libc = "0.2"

[dependencies]
model-serving-domain = { workspace = true }
# `time` is required for the probe deadline; the workspace already enables
# `process` / `io-util` / `macros` / `rt-multi-thread`.
tokio = { workspace = true, features = ["time", "sync"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
